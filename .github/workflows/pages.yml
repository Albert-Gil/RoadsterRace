name: Verify and deploy testing site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire main release, including verification, to preserve ordering.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Software WebGL is slow on hosted runners. Keep every smoke check,
        # with independent groups and require them all before deployment.
        group: [coastal-launch, launchsite, golden-gate, santa-monica, sessions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE_PATH: /RoadsterRace/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
        env:
          PAGES_ONLY: ${{ matrix.group }}
      - name: Save smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-test-evidence-${{ matrix.group }}
          path: artifacts/pages/
          if-no-files-found: ignore
      - name: Package website only
        if: matrix.group == 'coastal-launch' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
