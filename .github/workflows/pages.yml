name: Verify and deploy testing site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire main release, including verification, to preserve ordering.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Type checking and the unit suite run once, in three parallel shards beside the smoke
  # matrix (one job took ~20 minutes). Deployment requires every shard.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm is installed after this step; setup-node v5+ would otherwise try to cache with it.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  private-duels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm is installed after this step; setup-node v5+ would otherwise try to cache with it.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.duels.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: private-duel-browser-evidence
          path: test-results/

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Software WebGL is slow on hosted runners. Keep every smoke check,
        # with independent groups and require them all before deployment.
        group: [coastal-launch, launchsite, golden-gate, santa-monica, la-nights, snowy-tahoe, capitan-yosemite, canyon-south-rim, san-diego-fleet, lax, phone, multiplayer, solo, tournament]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm is installed after this step; setup-node v5+ would otherwise try to cache with it.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BASE_PATH: /RoadsterRace/
          VITE_DUEL_SERVER: ${{ vars.ROADSTER_DUEL_SERVER }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
        env:
          PAGES_ONLY: ${{ matrix.group }}
      - name: Save smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-test-evidence-${{ matrix.group }}
          path: artifacts/pages/
          if-no-files-found: ignore
      - name: Package website only
        if: matrix.group == 'coastal-launch' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit, verify, private-duels]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      published: ${{ steps.current.outputs.current }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm is installed after this step; setup-node v5+ would otherwise try to cache with it.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/configure-pages@v6
      - name: Check that this release is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer main commit ($latest) will publish instead of this one."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the room server contract
        if: steps.current.outputs.current == 'true'
        run: pnpm install --frozen-lockfile && pnpm duel:build
      - name: Update the room server if its contract changed
        if: steps.current.outputs.current == 'true'
        run: node tools/deploy-duel-server.mjs
        env:
          ROADSTER_DUEL_SERVER: ${{ vars.ROADSTER_DUEL_SERVER }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Publish verified build
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  # After publishing, a fresh browser opens the public site, waits for this release's build,
  # creates a Newport Island room and joins it from a second browser; both leave. A failure
  # fails the release run (tools/public-smoke.mjs). Skipped for website-only builds.
  public-smoke:
    needs: deploy
    if: needs.deploy.outputs.published == 'true' && vars.ROADSTER_DUEL_SERVER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm is installed after this step; setup-node v5+ would otherwise try to cache with it.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create and join a room on the public site
        run: node tools/public-smoke.mjs --url "${{ needs.deploy.outputs.page_url }}" --build "${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: public-smoke-evidence
          path: artifacts/public-smoke/
          if-no-files-found: ignore
