services:
  - type: web
    name: roadster-race-duels
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: 'off'
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm duel:build
    startCommand: node dist-server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # San Diego Fleet stays out of duels until the real-device 4-player test passes.
      # To enable it, set DUEL_EXTRA_VENUES=san-diego-fleet in the Render dashboard (docs/PRIVATE_DUELS.md).
